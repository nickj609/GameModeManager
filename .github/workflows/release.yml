name: Build & Release

# Merging to main publishes a release when ModuleVersion in GameModeManager/Plugin.cs is a version without a release.
# Merges that don't change the version only build. Pull requests build too, with the zip and the notes to look at.

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Publish again by hand, e.g. after a failed run
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      publish: ${{ steps.package.outputs.publish }}
    defaults:
      run:
        shell: pwsh
        working-directory: GameModeManager
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: GameModeManager
          fetch-depth: 0
          fetch-tags: true

      # GameModeManager.csproj references MenuManagerApi from this sibling folder. Same version as the server repo.
      - name: Checkout PanoramaMenuManager
        uses: actions/checkout@v4
        with:
          repository: RRimmer/PanoramaMenuManagerCS2
          ref: MenuManagerCS2-1.3.01
          path: PanoramaMenuManagerCS2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (.github/scripts/package-release.ps1 -OutDir "$env:RUNNER_TEMP/release" | Select-Object -Last 1)
          $version = [regex]::Match((Split-Path $zip -Leaf), 'GameModeManager_v(.+)\.zip').Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

          $publish = "false"
          if ("${{ github.event_name }}" -ne "pull_request") {
            gh release view "v$version" --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -ne 0) { $publish = "true" } else { "v$version already has a release: nothing to publish." }
            $global:LASTEXITCODE = 0
          }
          "publish=$publish" >> $env:GITHUB_OUTPUT

          # The default config needs the published Workshop addon, or players get no menus
          if ($publish -eq "true" -and (Select-String -Quiet -SimpleMatch 'WorkshopAddon { get; set; } = "";' GameModeManager/Config.cs)) {
            "Publish the Workshop addon and put its ID as the WorkshopAddon default in GameModeManager/Config.cs before releasing."
            exit 1
          }

      - name: Check bundled plugins
        run: .github/scripts/check-integrations.ps1

      - name: Check Kus's config
        run: |
          $config = "$env:RUNNER_TEMP/GameModeManager.json"
          Invoke-WebRequest -UseBasicParsing -OutFile $config -Uri "https://raw.githubusercontent.com/kus/cs2-modded-server/master/game/csgo/addons/counterstrikesharp/configs/plugins/GameModeManager/GameModeManager.json"
          dotnet run --project ci/ConfigCheck -c Release -- $config
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit on a pull request is GitHub's test merge, which has no pull request of its own
          $sha = "${{ github.event.pull_request.head.sha || github.sha }}"
          .github/scripts/release-notes.ps1 -Repo "${{ github.repository }}" -Sha $sha -OutFile "$env:RUNNER_TEMP/release/notes.md"
          Get-Content "$env:RUNNER_TEMP/release/notes.md" -Raw >> $env:GITHUB_STEP_SUMMARY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release/
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$env:VERSION" "release/GameModeManager_v$env:VERSION.zip" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "GameModeManager v$env:VERSION" `
            --notes-file release/notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Write Discord post
        run: .github/scripts/discord-release.ps1 -Version "${{ needs.build.outputs.version }}" -Repo "${{ github.repository }}" -NotesFile release/notes.md

  # Publishes the package when its version isn't on NuGet yet, so a run can also catch up after a missed one. Uses NuGet's
  # Trusted Publishing, so there's no key to store: nuget.org needs a policy for this repo and release.yml. It also goes to
  # GitHub Packages, which is what the repo's Packages list shows.
  nuget:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: |
          dotnet pack GameModeManager.Shared/GameModeManager.Shared.csproj -c Release -o nupkg -p:IsPacking=true
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The temporary key lasts an hour, so it's requested right before the push
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: nickj609

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # --skip-duplicate leaves a version that's already on NuGet alone
          dotnet nuget push "nupkg/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish to GitHub Packages
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget push "nupkg/*.nupkg" --api-key $env:GH_TOKEN --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # docs/wiki is the source of the GitHub wiki: edit the pages there, because this replaces what's on the wiki
  wiki:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
          cp docs/wiki/*.md wiki/
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update from ${{ github.sha }}"
          git push
