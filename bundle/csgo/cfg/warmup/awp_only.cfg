// name: AWP Only
// A respawn warmup with the current mode's teams and spawns: one loadout, no buying, no dropped weapons
exec settings/disable_buying.cfg
exec settings/disable_drop_weapons.cfg
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_respawn_immunitytime 2
mp_free_armor 1
mp_t_default_primary "weapon_awp"
mp_ct_default_primary "weapon_awp"
mp_t_default_secondary "weapon_deagle"
mp_ct_default_secondary "weapon_deagle"
mp_t_default_melee weapon_knife
mp_ct_default_melee weapon_knife
bot_randombuy false
echo "[Warmup Mode]: AWP Only executed."
