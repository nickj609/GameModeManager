// name: Drop weapons
// group: Players
// Dead players drop their gun, grenades, C4 and defuser (CS2's defaults). Off is disable_drop_weapons.cfg, which the
// warmups run too; it also turns off knife drop and weapons placed on the map.
mp_death_drop_c4 1
mp_death_drop_defuser 1
mp_death_drop_grenade 1
mp_death_drop_gun 1

echo "[CONFIG]: settings/enable_drop_weapons.cfg executed"
